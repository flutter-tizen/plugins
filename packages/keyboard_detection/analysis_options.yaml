# Follows the analysis options of the frontend plugin:
# https://github.com/lamnhan066/keyboard_detection/blob/main/analysis_options.yaml
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - 'build/**'
    - 'android/**'
    - 'ios/**'
    - 'web/**'
    - 'windows/**'
    - 'macos/**'
    - 'linux/**'
