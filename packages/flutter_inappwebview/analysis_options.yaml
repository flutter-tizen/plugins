# Follows the analysis options of the frontend plugin:
# https://github.com/pichillilorenzo/flutter_inappwebview/blob/master/flutter_inappwebview/analysis_options.yaml
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - 'build/**'
    - 'android/**'
    - 'ios/**'
    - 'web/**'
    - 'windows/**'
    - 'macos/**'
    - 'linux/**'
  errors:
    constant_identifier_names: ignore
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unnecessary_cast: ignore
    unnecessary_import: ignore
