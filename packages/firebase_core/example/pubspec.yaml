name: firebase_core_tizen_example
description: An example application demonstrating calls to Firebase Core.
publish_to: "none"

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  firebase_core: ^4.14.0
  firebase_core_tizen:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  firebase_core_platform_interface: ^8.1.1
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen:
    path: ../../integration_test/
