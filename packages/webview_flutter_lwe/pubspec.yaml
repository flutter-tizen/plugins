name: webview_flutter_lwe
description: Tizen implementation of the webview_flutter plugin backed by Lightweight Web Engine.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/webview_flutter_lwe
version: 0.5.6

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    implements: webview_flutter
    platforms:
      tizen:
        pluginClass: WebviewFlutterLwePlugin
        fileName: webview_flutter_lwe_plugin.h
        dartPluginClass: LweWebViewPlatform

dependencies:
  flutter:
    sdk: flutter
  flutter_tizen: ^0.2.1
  webview_flutter: ^4.14.1
  webview_flutter_platform_interface: ^2.15.1

topics:
  - html
  - webview
  - webview-flutter
