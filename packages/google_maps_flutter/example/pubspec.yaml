name: google_maps_flutter_tizen_example
description: Demonstrates how to use the google_maps_flutter_tizen plugin.
publish_to: "none"

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.17.0
  google_maps_flutter_platform_interface: ^2.15.0
  google_maps_flutter_tizen:
    path: ../

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen:
    path: ../../integration_test/

flutter:
  uses-material-design: true
  assets:
    - assets/
