name: video_player_tizen
description: Tizen implementation of the video_player plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/video_player
version: 2.6.1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: video_player
    platforms:
      tizen:
        pluginClass: VideoPlayerTizenPlugin
        fileName: video_player_tizen_plugin.h
        dartPluginClass: VideoPlayerTizen

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  meta: ^1.8.0
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  ffigen: ^22.0.0
  pigeon:
    git:
      url: https://github.com/gin7773/flutter-packages.git
      ref: 6259ba78fe8bedd6f021785dfabf9213fb7cb7d7
      path: packages/pigeon
