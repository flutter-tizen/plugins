name: package_info_plus_tizen
description: Tizen implementation of the package_info_plus plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/package_info_plus
version: 1.2.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

flutter:
  plugin:
    implements: package_info_plus
    platforms:
      tizen:
        pluginClass: PackageInfoPlusTizenPlugin
        fileName: package_info_plus_tizen_plugin.h

dependencies:
  flutter:
    sdk: flutter
  package_info_plus_platform_interface: ^4.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
