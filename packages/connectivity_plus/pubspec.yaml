name: connectivity_plus_tizen
description: Tizen implementation of the connectivity_plus plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/connectivity_plus
version: 1.3.3

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.7.0"

flutter:
  plugin:
    implements: connectivity_plus
    platforms:
      tizen:
        pluginClass: ConnectivityPlusTizenPlugin
        fileName: connectivity_plus_tizen_plugin.h

dependencies:
  connectivity_plus_platform_interface: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^2.0.1
