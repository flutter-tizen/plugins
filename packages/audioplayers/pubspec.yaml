name: audioplayers_tizen
description: Tizen implementation of the audioplayers plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/audioplayers
version: 3.1.8

environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: audioplayers
    platforms:
      tizen:
        pluginClass: AudioplayersTizenPlugin
        fileName: audioplayers_tizen_plugin.h

dependencies:
  audioplayers_platform_interface: ^7.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flame_lint: ^1.4.3
