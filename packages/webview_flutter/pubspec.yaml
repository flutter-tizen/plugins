name: webview_flutter_tizen
description: Tizen implementation of the webview_flutter plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/webview_flutter
version: 0.11.1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    implements: webview_flutter
    platforms:
      tizen:
        pluginClass: WebviewFlutterTizenPlugin
        fileName: webview_flutter_tizen_plugin.h
        dartPluginClass: TizenWebViewPlatform

dependencies:
  flutter:
    sdk: flutter
  flutter_tizen: ^0.2.1
  webview_flutter: ^4.14.1
  webview_flutter_platform_interface: ^2.15.1

topics:
  - html
  - webview
  - webview-flutter
