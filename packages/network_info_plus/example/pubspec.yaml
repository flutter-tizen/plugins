name: network_info_plus_example
description: Demonstrates how to use the network_info_plus_tizen plugin.
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^8.2.1
  network_info_plus_tizen:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen:
    path: ../../integration_test/
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
