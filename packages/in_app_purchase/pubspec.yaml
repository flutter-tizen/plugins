name: in_app_purchase_tizen
description: Tizen implementation of the in_app_purchase plugin for Samsung Smart TV.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/main/packages/in_app_purchase
version: 0.2.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    implements: in_app_purchase
    platforms:
      tizen:
        pluginClass: InAppPurchaseTizenPlugin
        fileName: in_app_purchase_tizen_plugin.h
        dartPluginClass: InAppPurchaseTizenPlatform

dependencies:
  crypto: ^3.0.2
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  in_app_purchase_platform_interface: ^1.4.0

dev_dependencies:
  build_runner: ^2.0.0
  ffigen: ^22.0.0
  pigeon:
    git:
      url: https://github.com/gin7773/flutter-packages.git
      ref: 1e63f1b5852a868d1b072de460752fe95e724600
      path: packages/pigeon
